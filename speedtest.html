<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقياس سرعة الإنترنت الاحترافي</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h2 {
            margin-top: 0;
            font-weight: 900;
            letter-spacing: 1px;
            color: #00d2ff;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 30px 0;
        }

        .metric-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
        }

        .metric-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .metric-title {
            font-size: 14px;
            color: #b3b9c5;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 5px;
            direction: ltr; /* لضبط الأرقام مع الحروف الإنجليزية */
        }

        .metric-unit {
            font-size: 14px;
            color: #00d2ff;
        }

        .btn {
            background: linear-gradient(90deg, #00d2ff 0%, #3a7bd5 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
            width: 100%;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
        }

        .btn:disabled {
            background: #555;
            color: #999;
            cursor: not-allowed;
            transform: scale(1);
            box-shadow: none;
        }

        /* أنيميشن التحميل */
        .loading-pulse {
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>فحص الشبكة ⚡</h2>
        <p style="color: #b3b9c5; margin-bottom: 30px;">تحقق من سرعة اتصالك واستجابته</p>

        <div class="metrics-grid">
            <!-- كرت الـ Ping -->
            <div class="metric-card">
                <div class="metric-icon">⏱️</div>
                <div class="metric-title">الاستجابة (Ping)</div>
                <div class="metric-value" id="pingResult">
                    -- <span class="metric-unit">ms</span>
                </div>
            </div>

            <!-- كرت التحميل -->
            <div class="metric-card">
                <div class="metric-icon">⬇️</div>
                <div class="metric-title">سرعة التحميل</div>
                <div class="metric-value" id="downloadResult">
                    -- <span class="metric-unit">Mbps</span>
                </div>
            </div>
        </div>

        <button id="startBtn" class="btn" onclick="startFullTest()">ابدأ الفحص</button>
    </div>

    <script>
        // إعدادات الفحص
        const pingImageTarget = "https://www.google.com/favicon.ico"; // ملف صغير جداً لقياس الاستجابة
        const downloadImageTarget = "https://upload.wikimedia.org/wikipedia/commons/a/a6/Brandenburger_Tor_abends.jpg";
        const downloadSizeBits = 2707459 * 8; // حجم الصورة بالبت

        // عناصر واجهة المستخدم
        const btn = document.getElementById("startBtn");
        const pingResult = document.getElementById("pingResult");
        const downloadResult = document.getElementById("downloadResult");

        async function startFullTest() {
            // تهيئة الواجهة قبل البدء
            btn.disabled = true;
            btn.innerText = "جاري الفحص...";
            
            pingResult.innerHTML = `<span class="loading-pulse">...</span> <span class="metric-unit">ms</span>`;
            downloadResult.innerHTML = `-- <span class="metric-unit">Mbps</span>`;

            // 1. فحص الاستجابة (Ping) أولاً
            await testPing();

            // 2. فحص سرعة التحميل (Download) ثانياً
            downloadResult.innerHTML = `<span class="loading-pulse">...</span> <span class="metric-unit">Mbps</span>`;
            await testDownload();

            // إنهاء الفحص
            btn.innerText = "إعادة الفحص";
            btn.disabled = false;
        }

        function testPing() {
            return new Promise((resolve) => {
                const img = new Image();
                let startTime = performance.now();
                const cacheBuster = "?nnn=" + startTime;

                img.onload = function () {
                    let endTime = performance.now();
                    let pingTime = Math.round(endTime - startTime);
                    pingResult.innerHTML = `${pingTime} <span class="metric-unit">ms</span>`;
                    resolve();
                };

                img.onerror = function () {
                    pingResult.innerHTML = `<span style="color: #ff4757; font-size:18px;">خطأ</span>`;
                    resolve();
                };

                img.src = pingImageTarget + cacheBuster;
            });
        }

        function testDownload() {
            return new Promise((resolve) => {
                const img = new Image();
                let startTime = performance.now();
                const cacheBuster = "?nnn=" + startTime;

                img.onload = function () {
                    let endTime = performance.now();
                    let durationInSeconds = (endTime - startTime) / 1000;
                    
                    let speedBps = downloadSizeBits / durationInSeconds;
                    let speedMbps = (speedBps / (1024 * 1024)).toFixed(2);

                    downloadResult.innerHTML = `${speedMbps} <span class="metric-unit">Mbps</span>`;
                    resolve();
                };

                img.onerror = function () {
                    downloadResult.innerHTML = `<span style="color: #ff4757; font-size:18px;">خطأ</span>`;
                    resolve();
                };

                img.src = downloadImageTarget + cacheBuster;
            });
        }
    </script>
</body>
</html>
